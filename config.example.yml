sample: sample1
outdir: results
strict: false

input:
  hits: selected_hits.tsv
  contigs: assembly.fasta
  references: references.nt.fasta

alignment:
  run: true
  use_existing_paf: false
  preset: asm5

dashboard:
  html: true

scoring:
  weights:
    protein_confidence: 0.30
    length_plausibility: 0.15
    containment: 0.25
    identity: 0.15
    fragmentation: 0.15
