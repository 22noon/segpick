[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "segpick"
version = "0.1.0"
description = "Evidence-based curation of segmented viral genome assemblies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "biopython",
    "pandas",
    "plotly",
    "jinja2",
    "pyyaml",
    "matplotlib",
    "jsonschema",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black"]

[project.scripts]
segpick = "segpick.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["segpick*"]
exclude = ["tests*", "md*"]

[tool.setuptools.package-data]
segpick = ["reporting/templates/*.html"]

[tool.black]
line-length = 1000
target-version = ["py312"]

[tool.ruff]
line-length = 1000
target-version = "py312"
[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
