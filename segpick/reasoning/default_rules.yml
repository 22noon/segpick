version: 1
rules:
  - id: possible_assembly_interruption
    title: Possible assembly interruption
    description: >
      Suggests that protein and read-coverage abnormalities may reflect a
      local interruption in the assembled coding sequence.
    category: assembly
    scope: candidate
    severity: review
    base_confidence: moderate
    summary: >
      Independent protein and read-coverage observations are consistent with
      a possible local assembly interruption.
    requires:
      - observation: internal_deletion
        source: protein_alignment
      - observation: coverage_drop
        source: read_coverage
    supports:
      - observation: partial_orf_start_boundary
        source: orf_structure
      - observation: partial_orf_end_boundary
        source: orf_structure
      - finding: Local evidence convergence
    conflicts:
      - finding: Complete protein recovered

  - id: divergent_structurally_supported_protein
    title: Possible divergent lineage
    description: >
      Identifies a broadly recovered and structurally intact protein whose
      similarity to represented database proteins is comparatively low.
    category: homology
    scope: candidate
    severity: informational
    base_confidence: moderate
    summary: >
      Low protein relatedness is accompanied by a structurally intact
      predicted protein, consistent with a potentially divergent lineage.
    requires:
      - finding: Divergent but structurally supported protein
      - finding: Complete protein recovered

  - id: possible_split_assembly
    title: Possible split assembly
    description: >
      Indicates that complementary protein regions are distributed across
      multiple contigs rather than recovered by one candidate.
    category: assembly
    scope: gene
    severity: warning
    base_confidence: high
    summary: >
      Complementary protein regions are distributed across multiple contigs,
      so selecting one contig may not recover the complete gene.
    requires:
      - finding: Possible split assembly

  - id: reference_supported_architecture
    title: Reference-supported candidate architecture
    description: >
      Represents the conservative explanation that the candidate follows the
      organisation of its closest nucleotide reference without a major
      structural interruption.
    category: assembly_structure
    scope: candidate
    severity: informational
    base_confidence: moderate
    summary: >
      Candidate structure is continuous and compatible with the closest
      reference organisation.
    requires:
      - observation: continuous_reference_structure
        source: structural_alignment
      - observation: reference_organisation_compatible
        source: reference_compatibility
    supports:
      - observation: complete_orf_read_coverage
        source: read_coverage
    conflicts:
      - observation: internal_coverage_interruption
        source: read_coverage
      - observation: duplicated_reference_mapping
        source: reference_compatibility

  - id: possible_repeated_sequence_architecture
    title: Possible repeated-sequence architecture
    description: >
      Represents the possibility that separate candidate regions genuinely
      contain related or duplicated sequence corresponding to the same
      reference interval. Independent junction or continuous read support can
      strengthen this interpretation.
    category: assembly_structure
    scope: candidate
    severity: review
    base_confidence: low
    summary: >
      Separate candidate regions map to overlapping reference coordinates,
      which may represent a genuine repeated-sequence architecture.
    requires:
      - observation: duplicated_reference_mapping
        source: reference_compatibility
    supports:
      - observation: complete_orf_read_coverage
        source: read_coverage
      - observation: coverage_continuous_across_reference_gap
        source: cross_evidence
      - observation: junction_supported
        source: plugin:junction_support
    conflicts:
      - observation: internal_coverage_interruption
        source: read_coverage
      - observation: coverage_gap_at_reference_boundary
        source: cross_evidence

  - id: possible_repeat_associated_assembly_artefact
    title: Possible repeat-associated assembly artefact
    description: >
      Represents the competing explanation that repeated mapping reflects an
      assembly error or repeat-resolution problem rather than a genuine
      biological duplication.
    category: assembly_structure
    scope: candidate
    severity: warning
    base_confidence: moderate
    summary: >
      Repeated reference mapping is accompanied by evidence that may indicate
      a repeat-associated assembly artefact.
    requires:
      - observation: duplicated_reference_mapping
        source: reference_compatibility
    supports:
      - observation: reference_structural_discontinuity
        source: structural_alignment
      - observation: reference_block_order_disrupted
        source: reference_compatibility
      - observation: unexpected_reference_orientation_switch
        source: reference_compatibility
      - observation: internal_coverage_interruption
        source: read_coverage
      - observation: coverage_gap_at_reference_boundary
        source: cross_evidence
    conflicts:
      - observation: complete_orf_read_coverage
        source: read_coverage
      - observation: coverage_continuous_across_reference_gap
        source: cross_evidence
      - observation: junction_supported
        source: plugin:junction_support
