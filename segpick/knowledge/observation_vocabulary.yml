version: 1
observations:
  reference_structural_discontinuity:
    display_name: Reference-alignment discontinuity
    category: Structural evidence
    description: The candidate-to-reference alignment contains an internal interruption or discontinuity.
  coverage_drop_at_reference_boundary:
    display_name: Coverage decrease at a structural boundary
    category: Combined evidence
    description: Read depth decreases close to a boundary in the reference-supported alignment.
  internal_coverage_interruption:
    display_name: Internal read-coverage interruption
    category: Read evidence
    description: An internal region of the biologically relevant sequence has unusually low or absent read coverage.
  weak_orf_terminal_support:
    display_name: Weak ORF terminal support
    category: Read evidence
    description: One or both ends of the predicted coding sequence have substantially weaker read support than its interior.
  partial_orf_start_boundary:
    display_name: Incomplete ORF start boundary
    category: ORF evidence
    description: The selected open reading frame does not have a confidently supported complete start boundary.
  partial_orf_end_boundary:
    display_name: Incomplete ORF end boundary
    category: ORF evidence
    description: The selected open reading frame does not have a confidently supported complete end boundary.
  continuous_reference_structure:
    display_name: Continuous reference-supported structure
    category: Structural evidence
    description: The candidate aligns across the expected reference structure without a major internal discontinuity.
